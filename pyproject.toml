[project]
name = "notebook-migrator-agent"
version = "0.1.0"
description = "Gemini Enterprise Agent for migrating NotebookLM Takeout archives into Gemini Enterprise Notebooks"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk[agent-identity]>=1.15.0",
    "google-cloud-agentidentitycredentials>=0.1.0",
    "google-cloud-iamconnectorcredentials>=0.1.0",
    "google-cloud-aiplatform[evaluation,agent-engines]>=1.70.0",
    "google-cloud-logging>=3.12.0",
    "pydantic>=2.0.0",
    "google-auth>=2.0.0",
    "requests>=2.28.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.agents-cli]
name = "notebook-migrator-agent"
description = "Gemini Enterprise Agent for migrating NotebookLM Takeout archives into Gemini Enterprise Notebooks"
base_template = "adk"
agent_directory = "app"

[tool.agents-cli.create_params]
deployment_target = "agent_runtime"
session_type = "none"
cicd_runner = "skip"
include_data_ingestion = false
datastore = "none"
